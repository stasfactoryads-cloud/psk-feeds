name: Update Yandex Direct Feeds

on:
  schedule:
    # Каждый день в 06:00 UTC (09:00 МСК)
    - cron: '0 6 * * *'
  workflow_dispatch: # Ручной запуск

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate feeds
        run: python generate_feed.py

      - name: Check for changes
        id: changes
        run: |
          git add -A *.xml
          git diff --cached --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PSKALL=$(grep -c '<offer ' pskall_yandex_direct_feed.xml 2>/dev/null || echo "0")
          RESPEKT=$(grep -c '<offer ' respekt_yandex_direct_feed.xml 2>/dev/null || echo "0")
          OPTIMIST=$(grep -c '<offer ' optimist_yandex_direct_feed.xml 2>/dev/null || echo "0")
          SEZONY=$(grep -c '<offer ' sezony_yandex_direct_feed.xml 2>/dev/null || echo "0")
          TOTAL=$((PSKALL))
          git commit -m "Update feeds: ${TOTAL} flats total (pskall) R:${RESPEKT} O:${OPTIMIST} S:${SEZONY} $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
